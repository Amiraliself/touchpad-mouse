name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare signing key
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KEY_PASS" ] && [ -f signing/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:KEY_PASS
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with release key"
          else
            echo "No release key found; building debug APK"
          fi
      - name: Build
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
      - name: Collect APK
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_FILE" ]; then
            cp app/build/outputs/apk/release/*.apk out/
          else
            cp app/build/outputs/apk/debug/*.apk out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CursorPad-apk
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CursorPad build ${{ github.run_number }}
          files: out/*.apk
